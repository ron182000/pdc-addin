<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contoso Task Pane Add-in</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric app-body">
    <div class="container">
        
        <!-- API KEY -->
        <div class="section config-section">
            <label class="premium-label" for="api-key-input">API Key de Gemini</label>
            <input class="premium-input" type="password" id="api-key-input" placeholder="Ingresa tu clave AIzaSy..." />
        </div>

        <!-- PASO 1 -->
        <div class="section">
            <h2 class="step-title">Paso 1 - Generar Tabla de Datos Generales</h2>
            <button class="premium-button primary" id="insertar-encabezado">
                <span class="btn-text">Insertar Encabezado</span>
            </button>
        </div>

        <!-- PASO 2 -->
        <div class="section">
            <h2 class="step-title">Paso 2 - Generar Tabla de Desarrollo Curricular</h2>
            <button class="premium-button primary" id="insertar-cuerpo">
                <span class="btn-text">Insertar Cuerpo</span>
            </button>
            
            <div class="form-group mt-3">
                <label class="premium-label" for="materia-input">Materia</label>
                <input class="premium-input" type="text" id="materia-input" placeholder="Ej: Química" />
            </div>
            
            <div class="form-group">
                <label class="premium-label" for="curso-input">Curso</label>
                <input class="premium-input" type="text" id="curso-input" placeholder="Ej: 4to Secundaria" />
            </div>
            
            <div class="form-group">
                <label class="premium-label" for="temario-input">Contenidos (Temario)</label>
                <textarea class="premium-input" id="temario-input" rows="3" placeholder="Ej: Compuestos orgánicos..."></textarea>
            </div>

            <button class="premium-button action" id="generar-intro">
                <span class="btn-text">Generar PDC</span>
                <div class="loader" id="ai-loader" style="display: none;"></div>
            </button>
        </div>
        
    </div>
</body>

</html>
